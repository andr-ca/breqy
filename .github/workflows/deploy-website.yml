          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_PROD }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: main
          CLOUDFLARE_PAGES_CUSTOM_DOMAIN: breqy.com
          CLOUDFLARE_DNS_ZONE: breqy.com
          CLOUDFLARE_PAGES_DNS_TARGET: breqy-prod.pages.dev

