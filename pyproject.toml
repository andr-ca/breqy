[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breqy"
version = "0.1.0"
description = "Linux-first, always-on, multi-agent AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "textual>=0.71.0",
    "structlog>=24.0.0",
    "python-ulid>=2.0.0",
    "pyyaml>=6.0.1",
    "keyring>=25.0.0",
]

[project.scripts]
breqy-orchestrator = "system.orchestrator.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["breqy", "system"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
