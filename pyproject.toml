[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breqy-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "textual>=0.71.0",
    "playwright>=1.52.0",
    "python-ulid>=2.0.0",
    "pyyaml>=6.0.1",
    "structlog>=24.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27",
    "keyring>=25",
    "pyperclip>=1.8",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
breqy = "breqy.cli:main"
breqy-orchestrator = "system.orchestrator.main:main"

[tool.hatch.build.targets.wheel]
packages = ["system", "breqy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["system", "breqy"]
